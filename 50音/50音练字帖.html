<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>平假名与片假名练字帖</title>
<style>
@page { size: A4 landscape; margin: 10mm; }
* { box-sizing: border-box; }
body { margin: 0; color: #111; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
.practice-row { display: grid; grid-template-columns: repeat(25, 10mm); gap: 1mm; width: fit-content; margin: 0 auto 1mm; break-inside: avoid; page-break-inside: avoid; }
.cell { width: 10mm; height: 10mm; border: 1px solid #555; display: grid; place-items: center; font-size: 17pt; line-height: 1; background-image: repeating-linear-gradient(to bottom, #d0d0d0 0 1px, transparent 1px 3px), repeating-linear-gradient(to right, #d0d0d0 0 1px, transparent 1px 3px); background-size: 1px 100%, 100% 1px; background-repeat: no-repeat; background-position: center; }
.romaji { font-size: 10pt; }
.trace { color: #d2d2d2; }
.sample { color: #111; }
@media screen { body { width: 297mm; margin: 0 auto; padding: 10mm; background: #eee; } }
</style>
</head>
<body><main id="worksheet" aria-label="五十音平假名与片假名练字帖"></main>
<script>
const rows = [
["a","あ","ア"],["i","い","イ"],["u","う","ウ"],["e","え","エ"],["o","お","オ"],
["ka","か","カ"],["ki","き","キ"],["ku","く","ク"],["ke","け","ケ"],["ko","こ","コ"],
["sa","さ","サ"],["shi","し","シ"],["su","す","ス"],["se","せ","セ"],["so","そ","ソ"],
["ta","た","タ"],["chi","ち","チ"],["tsu","つ","ツ"],["te","て","テ"],["to","と","ト"],
["na","な","ナ"],["ni","に","ニ"],["nu","ぬ","ヌ"],["ne","ね","ネ"],["no","の","ノ"],
["ha","は","ハ"],["hi","ひ","ヒ"],["fu","ふ","フ"],["he","へ","ヘ"],["ho","ほ","ホ"],
["ma","ま","マ"],["mi","み","ミ"],["mu","む","ム"],["me","め","メ"],["mo","も","モ"],
["ya","や","ヤ"],["yu","ゆ","ユ"],["yo","よ","ヨ"],
["ra","ら","ラ"],["ri","り","リ"],["ru","る","ル"],["re","れ","レ"],["ro","ろ","ロ"],
["wa","わ","ワ"],["wo","を","ヲ"],["n","ん","ン"]
];
const worksheet = document.querySelector("#worksheet");
rows.forEach(([romaji, ...kana]) => {
  const row = document.createElement("div");
  row.className = "practice-row";
  row.innerHTML = '<div class="cell romaji">' + romaji + '</div>' + kana.map(char =>
    '<div class="cell sample">' + char + '</div>' + ('<div class="cell trace">' + char + '</div>').repeat(3) + '<div class="cell blank"></div>'.repeat(8)
  ).join("");
  worksheet.append(row);
});
</script></body></html>
